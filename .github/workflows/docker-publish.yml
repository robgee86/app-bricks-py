name: RELEASE - Build & Publish Release

run-name: "Release ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags:
      - "release/*"
      - "ai/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. release/1.2.3)"
        type: string
        required: true

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_DESTINATION_ORG: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  actions: write

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    outputs:
      tag_ref: ${{ steps.detect.outputs.tag_ref }}
      tag_prefix: ${{ steps.detect.outputs.tag_prefix }}
      version: ${{ steps.detect.outputs.version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      containers: ${{ steps.detect.outputs.containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect containers to release
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_REF="${{ inputs.tag }}"
          else
            TAG_REF="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG_REF#*/}"
          TAG_PREFIX="${TAG_REF%%/*}"
          echo "tag_ref=$TAG_REF" >> $GITHUB_OUTPUT
          echo "tag_prefix=$TAG_PREFIX" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ rc|alpha|beta ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          # The tag prefix selects a group of containers in docker-bake.hcl
          echo "Tag prefix filter: ${TAG_PREFIX}"
          MATCHING=$(docker buildx bake --print "$TAG_PREFIX" 2>/dev/null | jq -r --arg g "$TAG_PREFIX" '(.group[$g].targets // []) | join(" ")' || true)
          echo "Matching containers: ${MATCHING:-none}"

          if [[ -z "$MATCHING" ]]; then
            echo "containers=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Containers released by another tag prefix are never cascade-released:
          # they are built in-graph as parents when needed, on their own tag otherwise
          OTHER_GROUP_MEMBERS=$(docker buildx bake --list=targets 2>/dev/null \
            | awk -F'\t+' -v g="$TAG_PREFIX" 'NR>1 && $2 != "" && $1 != "default" && $1 != g {print $2}' \
            | tr -d ' ' | tr ',' '\n' | sort -u)

          # Widen with the containers deriving from the matching ones
          CONTAINERS=$(python3 scripts/container_deps.py closure --exclude $OTHER_GROUP_MEMBERS -- $MATCHING)
          echo "Containers: $(echo "$CONTAINERS" | jq -r 'join(" ")')"
          echo "containers=$CONTAINERS" >> $GITHUB_OUTPUT

  upload-whl:
    runs-on: ubuntu-24.04-arm
    needs: [detect]
    env:
      PYTHON_VERSION: "3.13"
      TASKFILE_VERSION: "3.45.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wheel in debian:trixie
        if: startsWith(needs.detect.outputs.tag_ref, 'release/')
        run: |
          # Remove tags that setuptools_scm can't parse (only ai/* and release/* are valid)
          git tag -l | grep -v -E '^(ai|release)/' | xargs -r git tag -d

          # Explicitly set the version so setuptools_scm does not need the git tag to exist
          # (handles workflow_dispatch runs where no tag has been pushed yet)
          docker run --rm \
            -v "${{ github.workspace }}:/${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e PUBLIC_IMAGE_REGISTRY_BASE="${{ env.GHCR_DESTINATION_ORG }}/" \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="${{ needs.detect.outputs.version }}" \
            debian:trixie bash -c "
              set -e
              apt-get update
              apt-get install -y --no-install-recommends --no-install-suggests sudo git ca-certificates python3-dev python3-pip build-essential pkg-config
              echo '[global]' > /etc/pip.conf
              echo 'break-system-packages = true' >> /etc/pip.conf
              git config --global --add safe.directory '*'
              pip install go-task-bin==${{ env.TASKFILE_VERSION }}
              pip install https://github.com/${{ github.repository }}/releases/download/opencv/4.13.0.92/opencv_python_headless-4.13.0.92-cp313-cp313-linux_aarch64.whl
              task init:ci
              task build
            "

      - name: Share wheel with downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: whl
          path: dist/arduino*.whl
          retention-days: 1

  build:
    runs-on: ubuntu-24.04-arm
    needs: [detect, upload-whl]
    if: needs.detect.outputs.containers != '[]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log into registry ${{ env.GHCR_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Check wheel requirement
        id: wheel
        run: |
          # Containers with a wheel bake context need the wheel artifact in dist/
          echo "required=$(docker buildx bake --print $(jq -r 'join(" ")' <<< '${{ needs.detect.outputs.containers }}') 2>/dev/null | jq '[.target[].contexts // {} | has("wheel")] | any')" >> $GITHUB_OUTPUT

      - name: Download wheel artifact
        if: steps.wheel.outputs.required == 'true'
        uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist/

      # Bake builds the containers in dependency order through the parent links
      # declared in docker-bake.hcl
      - name: Build and push Docker images
        uses: docker/bake-action@v7
        with:
          source: .
          targets: ${{ join(fromJson(needs.detect.outputs.containers)) }}
          files: ./docker-bake.hcl
          push: true
        env:
          REGISTRY: ${{ env.GHCR_DESTINATION_ORG }}/
          IMAGE_TAG: ${{ needs.detect.outputs.version }}
          BASE_IMAGE_VERSION: ${{ needs.detect.outputs.version }}
          CACHE_TAG: release-buildcache

      - name: SBOM Delta
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          REGISTRY: ${{ env.GHCR_DESTINATION_ORG }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          python3 ./scripts/sbom_delta.py \
            --version "$VERSION" \
            --registry "$REGISTRY" \
            --published "$(jq -r 'join(" ")' <<< '${{ needs.detect.outputs.containers }}')" \
            $(jq -r 'join(" ")' <<< '${{ needs.detect.outputs.containers }}')

      - name: Upload delta SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-delta-${{ needs.detect.outputs.tag_prefix }}
          path: ./containers/*/sbom-delta/

      - name: Update compose file references
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          for CONTAINER in $(jq -r 'join(" ")' <<< '${{ needs.detect.outputs.containers }}'); do
            find src \( -name "brick_compose*.yaml" -o -name "service_compose*.yaml" \) | while read f; do
              if grep -q "$CONTAINER" "$f"; then
                echo "  Updating: $f"
                sed -i -E "s|${CONTAINER}:[^ \"']+|${CONTAINER}:${VERSION}|g" "$f"
              fi
            done
          done

      - name: Configure Git
        run: |
          git config user.name "AppLab Actions Bot"
          git config user.email "bot@arduino.cc"

      # Opens no PR when the compose update touched nothing
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: update image references to ${{ needs.detect.outputs.version }}"
          title: "[RELEASE BOT] Update image references for ${{ needs.detect.outputs.tag_ref }}"
          body: |
            This PR was automatically generated after the release of `${{ needs.detect.outputs.tag_ref }}`.
          branch: "container-release-${{ needs.detect.outputs.tag_prefix }}-${{ needs.detect.outputs.version }}"
          base: main
          draft: true

  upload-release:
    runs-on: ubuntu-24.04-arm
    if: startsWith(needs.detect.outputs.tag_ref, 'release/')
    needs: [detect, upload-whl, build]
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist/

      - name: Download all SBOM delta artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-delta-*
          path: sbom-delta/

      - name: Zip SBOM artifacts
        run: zip -r dist/sboms.zip sbom-delta/

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arduino*.whl
            dist/sboms.zip
          tag_name: ${{ needs.detect.outputs.tag_ref }}
          name: Release ${{ needs.detect.outputs.version }}
          prerelease: ${{ needs.detect.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
