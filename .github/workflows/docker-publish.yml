name: RELEASE - Build & Publish Release

run-name: "Release ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags:
      - "release/*"
      - "ai/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. release/1.2.3)"
        type: string
        required: true

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_DESTINATION_ORG: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  actions: write

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    outputs:
      tag_ref: ${{ steps.detect.outputs.tag_ref }}
      tag_prefix: ${{ steps.detect.outputs.tag_prefix }}
      version: ${{ steps.detect.outputs.version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      base_containers: ${{ steps.detect.outputs.base_containers }}
      downstream_containers: ${{ steps.detect.outputs.downstream_containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect containers to release
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_REF="${{ inputs.tag }}"
          else
            TAG_REF="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG_REF#*/}"
          TAG_PREFIX="${TAG_REF%%/*}"
          echo "tag_ref=$TAG_REF" >> $GITHUB_OUTPUT
          echo "tag_prefix=$TAG_PREFIX" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ rc|alpha|beta ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          # The tag prefix selects a group of containers in docker-bake.hcl
          echo "Tag prefix filter: ${TAG_PREFIX}"
          MATCHING=$(docker buildx bake --print "$TAG_PREFIX" 2>/dev/null | jq -r --arg g "$TAG_PREFIX" '(.group[$g].targets // []) | join(" ")' || true)
          echo "Matching containers: ${MATCHING:-none}"

          if [[ -z "$MATCHING" ]]; then
            echo "base_containers=[]" >> $GITHUB_OUTPUT
            echo "downstream_containers=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Split into build waves, adding the containers deriving from the matching ones
          WAVES=$(python3 scripts/container_deps.py waves $MATCHING)
          echo "Base containers: $(echo "$WAVES" | jq -r '.base | join(" ")')"
          echo "Downstream containers: $(echo "$WAVES" | jq -r '.downstream | join(" ")')"
          echo "base_containers=$(echo "$WAVES" | jq -c .base)" >> $GITHUB_OUTPUT
          echo "downstream_containers=$(echo "$WAVES" | jq -c .downstream)" >> $GITHUB_OUTPUT

  upload-whl:
    runs-on: ubuntu-24.04-arm
    needs: [detect]
    env:
      PYTHON_VERSION: "3.13"
      TASKFILE_VERSION: "3.45.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wheel in debian:trixie
        if: startsWith(needs.detect.outputs.tag_ref, 'release/')
        run: |
          # Remove tags that setuptools_scm can't parse (only ai/* and release/* are valid)
          git tag -l | grep -v -E '^(ai|release)/' | xargs -r git tag -d

          # Explicitly set the version so setuptools_scm does not need the git tag to exist
          # (handles workflow_dispatch runs where no tag has been pushed yet)
          docker run --rm \
            -v "${{ github.workspace }}:/${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e PUBLIC_IMAGE_REGISTRY_BASE="${{ env.GHCR_DESTINATION_ORG }}/" \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="${{ needs.detect.outputs.version }}" \
            debian:trixie bash -c "
              set -e
              apt-get update
              apt-get install -y --no-install-recommends --no-install-suggests sudo git ca-certificates python3-dev python3-pip build-essential pkg-config
              echo '[global]' > /etc/pip.conf
              echo 'break-system-packages = true' >> /etc/pip.conf
              git config --global --add safe.directory '*'
              pip install go-task-bin==${{ env.TASKFILE_VERSION }}
              pip install https://github.com/${{ github.repository }}/releases/download/opencv/4.13.0.92/opencv_python_headless-4.13.0.92-cp313-cp313-linux_aarch64.whl
              task init:ci
              task build
            "

      - name: Share wheel with downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: whl
          path: dist/arduino*.whl
          retention-days: 1

  build:
    runs-on: ubuntu-24.04-arm
    needs: [detect, upload-whl]
    if: needs.detect.outputs.base_containers != '[]'
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.detect.outputs.base_containers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log into registry ${{ env.GHCR_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if rebuild required
        id: rebuild_check
        run: |
          TAG_PREFIX="${{ needs.detect.outputs.tag_prefix }}"
          CURRENT_TAG="${TAG_PREFIX}/${{ needs.detect.outputs.version }}"
          git fetch --tags
          PREV_TAG=$(git tag --sort=-version:refname | grep "^${TAG_PREFIX}/" | grep -v "^${CURRENT_TAG}$" | head -1)

          # The container sources are its bake contexts; the wheel context is built
          # from the Python sources, so watch those instead of the untracked dist/
          WATCH_PATHS=$(docker buildx bake --print "${{ matrix.container }}" 2>/dev/null | jq -r '
            .target["${{ matrix.container }}"]
            | [.context] + [(.contexts // {} | to_entries[] | if .key == "wheel" then "src/ pyproject.toml Taskfile.dist.yml" else .value end)]
            | join(" ")')
          echo "Watch paths: $WATCH_PATHS"

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous tag found for ${{ matrix.container }} — full build required"
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "prev_version=" >> $GITHUB_OUTPUT
          else
            PREV_VERSION="${PREV_TAG#${TAG_PREFIX}/}"
            echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT
            CHANGED=$(git diff --name-only "$PREV_TAG" HEAD -- $WATCH_PATHS)
            if [[ -n "$CHANGED" ]]; then
              echo "Sources changed since $PREV_TAG — full build required"
              echo "$CHANGED"
              echo "needs_build=true" >> $GITHUB_OUTPUT
            elif ! docker buildx imagetools inspect ${{ env.GHCR_DESTINATION_ORG }}/app-bricks/${{ matrix.container }}:${PREV_VERSION} > /dev/null 2>&1; then
              echo "Previous image ${PREV_VERSION} not found in registry — full build required"
              echo "needs_build=true" >> $GITHUB_OUTPUT
            else
              echo "No source changes and previous image exists — will re-tag from ${PREV_VERSION}"
              echo "needs_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Re-tag image
        if: steps.rebuild_check.outputs.needs_build == 'false'
        run: |
          echo "Re-tagging ${{ matrix.container }} from ${{ steps.rebuild_check.outputs.prev_version }} to ${{ needs.detect.outputs.version }}"
          docker buildx imagetools create \
            --tag ${{ env.GHCR_DESTINATION_ORG }}/app-bricks/${{ matrix.container }}:${{ needs.detect.outputs.version }} \
            ${{ env.GHCR_DESTINATION_ORG }}/app-bricks/${{ matrix.container }}:${{ steps.rebuild_check.outputs.prev_version }}

      - name: Build and publish container
        if: steps.rebuild_check.outputs.needs_build == 'true'
        uses: ./.github/actions/build-container
        with:
          container: ${{ matrix.container }}
          registry: ${{ env.GHCR_DESTINATION_ORG }}/
          version: ${{ needs.detect.outputs.version }}
          tags: type=raw,value=${{ needs.detect.outputs.version }}
          registry-host: ${{ env.GHCR_REGISTRY }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: SBOM Delta
        uses: ./.github/actions/sbom-delta
        with:
          container: ${{ matrix.container }}
          version: ${{ needs.detect.outputs.version }}
          registry: ${{ env.GHCR_DESTINATION_ORG }}

      - name: Update compose file references
        env:
          CONTAINER: ${{ matrix.container }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          find src \( -name "brick_compose*.yaml" -o -name "service_compose*.yaml" \) | while read f; do
            if grep -q "$CONTAINER" "$f"; then
              echo "  Updating: $f"
              sed -i -E "s|${CONTAINER}:[^ \"']+|${CONTAINER}:${VERSION}|g" "$f"
            fi
          done

      - name: Configure Git
        run: |
          git config user.name "AppLab Actions Bot"
          git config user.email "bot@arduino.cc"

      # Opens no PR when the compose update touched nothing
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: update ${{ matrix.container }} image references"
          title: "[RELEASE BOT] Update ${{ matrix.container }} image references"
          body: |
            This PR was automatically generated after releasing `${{ matrix.container }}:${{ needs.detect.outputs.version }}`.
          branch: "container-release-${{ matrix.container }}-${{ needs.detect.outputs.version }}"
          base: main
          draft: true

  build-downstream:
    runs-on: ubuntu-24.04-arm
    needs: [detect, build]
    if: needs.detect.outputs.downstream_containers != '[]'
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.detect.outputs.downstream_containers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check wheel requirement
        id: wheel
        run: |
          # Containers with a wheel bake context need the wheel artifact in dist/
          echo "required=$(docker buildx bake --print "${{ matrix.container }}" 2>/dev/null | jq '.target["${{ matrix.container }}"].contexts.wheel != null')" >> $GITHUB_OUTPUT

      - name: Download wheel artifact
        if: steps.wheel.outputs.required == 'true'
        uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist/

      - name: Build and publish container
        uses: ./.github/actions/build-container
        with:
          container: ${{ matrix.container }}
          registry: ${{ env.GHCR_DESTINATION_ORG }}/
          version: ${{ needs.detect.outputs.version }}
          tags: type=raw,value=${{ needs.detect.outputs.version }}
          registry-host: ${{ env.GHCR_REGISTRY }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: SBOM Delta
        uses: ./.github/actions/sbom-delta
        with:
          container: ${{ matrix.container }}
          version: ${{ needs.detect.outputs.version }}
          registry: ${{ env.GHCR_DESTINATION_ORG }}

      - name: Update compose file references
        env:
          CONTAINER: ${{ matrix.container }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          find src \( -name "brick_compose*.yaml" -o -name "service_compose*.yaml" \) | while read f; do
            if grep -q "$CONTAINER" "$f"; then
              echo "  Updating: $f"
              sed -i -E "s|${CONTAINER}:[^ \"']+|${CONTAINER}:${VERSION}|g" "$f"
            fi
          done

      - name: Configure Git
        run: |
          git config user.name "AppLab Actions Bot"
          git config user.email "bot@arduino.cc"

      # Opens no PR when the compose update touched nothing
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: update ${{ matrix.container }} image references"
          title: "[RELEASE BOT] Update ${{ matrix.container }} image references"
          body: |
            This PR was automatically generated after releasing `${{ matrix.container }}:${{ needs.detect.outputs.version }}`.
          branch: "container-release-${{ matrix.container }}-${{ needs.detect.outputs.version }}"
          base: main
          draft: true

  upload-release:
    runs-on: ubuntu-24.04-arm
    if: startsWith(needs.detect.outputs.tag_ref, 'release/')
    needs: [detect, upload-whl, build, build-downstream]
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist/

      - name: Download all SBOM delta artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-delta-*
          path: sbom-delta/

      - name: Zip SBOM artifacts
        run: zip -r dist/sboms.zip sbom-delta/

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arduino*.whl
            dist/sboms.zip
          tag_name: ${{ needs.detect.outputs.tag_ref }}
          name: Release ${{ needs.detect.outputs.version }}
          prerelease: ${{ needs.detect.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
