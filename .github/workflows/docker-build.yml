name: DEV - Build & Publish Branch Containers

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (defaults to selected branch)"
        type: string
        required: false
        default: ""
      containers:
        description: "Comma-separated container names to build, or 'all' for all containers"
        type: string
        default: "all"
      tag:
        description: "Custom image tag (optional, defaults to sanitized branch name)"
        type: string
        default: ""
      skip_cache:
        description: "Rebuild without cache"
        required: false
        type: boolean
        default: false

env:
  REGISTRY_HOST: ghcr.io
  DEV_REGISTRY_PATH: ghcr.io/${{ github.repository_owner }}/

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-24.04-arm
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      containers: ${{ steps.detect.outputs.containers }}
      downstream_containers: ${{ steps.detect.outputs.downstream_containers }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
    steps:
      - name: Resolve branch
        id: resolve
        run: |
          BRANCH="${{ inputs.branch || github.ref_name }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Resolve containers to build
        id: detect
        run: |
          # Compute image tag from branch name unless an explicit tag was provided
          if [[ -n "${{ inputs.tag }}" ]]; then
            IMAGE_TAG="${{ inputs.tag }}"
          else
            IMAGE_TAG="dev-$(echo "${{ steps.resolve.outputs.branch }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          INPUT="${{ inputs.containers }}"
          if [[ "$INPUT" == "all" ]]; then
            SELECTED=$(basename -a $(dirname containers/*/Dockerfile))
          else
            SELECTED=$(echo "$INPUT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' || true)
          fi

          if [[ -z "$SELECTED" ]]; then
            echo "No containers to build"
            echo "containers=[]" >> $GITHUB_OUTPUT
            echo "downstream_containers=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Widen the selection with parents and derived containers, split into build waves
          WAVES=$(python3 scripts/container_deps.py waves --expand-parents $SELECTED)
          echo "Base containers: $(echo "$WAVES" | jq -r '.base | join(" ")')"
          echo "Downstream containers: $(echo "$WAVES" | jq -r '.downstream | join(" ")')"
          echo "containers=$(echo "$WAVES" | jq -c .base)" >> $GITHUB_OUTPUT
          echo "downstream_containers=$(echo "$WAVES" | jq -c .downstream)" >> $GITHUB_OUTPUT

          # Fail here rather than on every build runner if a container has no bake target
          docker buildx bake --print $(echo "$WAVES" | jq -r '.base + .downstream | join(" ")') > /dev/null

  build:
    needs: [setup]
    if: needs.setup.outputs.containers != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.setup.outputs.containers) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0

      - name: Build and publish container
        uses: ./.github/actions/build-container
        with:
          container: ${{ matrix.container }}
          registry: ${{ env.DEV_REGISTRY_PATH }}
          version: ${{ needs.setup.outputs.image_tag }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=${{ needs.setup.outputs.image_tag }}-${{ github.run_number }}
          cache-tag: ${{ needs.setup.outputs.image_tag }}-buildcache
          skip-cache: ${{ inputs.skip_cache }}
          registry-host: ${{ env.REGISTRY_HOST }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: SBOM Delta
        uses: ./.github/actions/sbom-delta
        with:
          container: ${{ matrix.container }}
          version: ${{ needs.setup.outputs.image_tag }}
          registry: ${{ env.DEV_REGISTRY_PATH }}

  build-downstream:
    needs: [setup, build]
    if: needs.setup.outputs.downstream_containers != '[]'
    runs-on: ubuntu-24.04-arm
    env:
      TASKFILE_VERSION: "3.45.4"
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.setup.outputs.downstream_containers) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0

      - name: Build wheel in debian:trixie
        if: matrix.container == 'python-apps-base'
        run: |
          # Remove tags that setuptools_scm can't parse (only ai/* and release/* are valid)
          git tag -l | grep -v -E '^(ai|release)/' | xargs -r git tag -d

          docker run --rm \
            -v "${{ github.workspace }}:/${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e PUBLIC_IMAGE_REGISTRY_BASE="${{ env.DEV_REGISTRY_PATH }}/" \
            -e DEV_TAG_VERSION="${{ needs.setup.outputs.image_tag }}" \
            debian:trixie bash -c "
              set -e
              apt-get update
              apt-get install -y --no-install-recommends --no-install-suggests sudo git ca-certificates python3-dev python3-pip build-essential pkg-config
              echo '[global]' > /etc/pip.conf
              echo 'break-system-packages = true' >> /etc/pip.conf
              git config --global --add safe.directory '*'
              pip install go-task-bin==${{ env.TASKFILE_VERSION }}
              task init:ci
              task build-dev
            "

      - name: Build and publish container
        uses: ./.github/actions/build-container
        with:
          container: ${{ matrix.container }}
          registry: ${{ env.DEV_REGISTRY_PATH }}
          version: ${{ needs.setup.outputs.image_tag }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=${{ needs.setup.outputs.image_tag }}-${{ github.run_number }}
          cache-tag: ${{ needs.setup.outputs.image_tag }}-buildcache
          skip-cache: ${{ inputs.skip_cache }}
          registry-host: ${{ env.REGISTRY_HOST }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: SBOM Delta
        uses: ./.github/actions/sbom-delta
        with:
          container: ${{ matrix.container }}
          version: ${{ needs.setup.outputs.image_tag }}
          registry: ${{ env.DEV_REGISTRY_PATH }}
