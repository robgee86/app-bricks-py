name: DEV - Build & Publish Branch Containers

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (defaults to selected branch)"
        type: string
        required: false
        default: ""
      containers:
        description: "Comma-separated container names to build, or 'all' for all containers"
        type: string
        default: "all"
      tag:
        description: "Custom image tag (optional, defaults to sanitized branch name)"
        type: string
        default: ""
      skip_cache:
        description: "Rebuild without cache"
        required: false
        type: boolean
        default: false

env:
  REGISTRY_HOST: ghcr.io
  DEV_REGISTRY_PATH: ghcr.io/${{ github.repository_owner }}/

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-24.04-arm
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      containers: ${{ steps.detect.outputs.containers }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
    steps:
      - name: Resolve branch
        id: resolve
        run: |
          BRANCH="${{ inputs.branch || github.ref_name }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Resolve containers to build
        id: detect
        run: |
          # Compute image tag from branch name unless an explicit tag was provided
          if [[ -n "${{ inputs.tag }}" ]]; then
            IMAGE_TAG="${{ inputs.tag }}"
          else
            IMAGE_TAG="dev-$(echo "${{ steps.resolve.outputs.branch }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          INPUT="${{ inputs.containers }}"
          if [[ "$INPUT" == "all" ]]; then
            SELECTED=$(basename -a $(dirname containers/*/Dockerfile))
          else
            SELECTED=$(echo "$INPUT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' || true)
          fi

          if [[ -z "$SELECTED" ]]; then
            echo "No containers to build"
            echo "containers=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Widen the selection with parents and derived containers, so related
          # images stay consistent; bake orders the builds through parent links
          CONTAINERS=$(python3 scripts/container_deps.py closure --expand-parents $SELECTED)
          echo "Containers: $(echo "$CONTAINERS" | jq -r 'join(" ")')"
          echo "containers=$CONTAINERS" >> $GITHUB_OUTPUT

          # Fail early if a container has no bake target
          docker buildx bake --print $(echo "$CONTAINERS" | jq -r 'join(" ")') > /dev/null

  build:
    needs: [setup]
    if: needs.setup.outputs.containers != '[]'
    runs-on: ubuntu-24.04-arm
    env:
      TASKFILE_VERSION: "3.45.4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0

      - name: Build wheel in debian:trixie
        if: contains(fromJson(needs.setup.outputs.containers), 'python-apps-base')
        run: |
          # Remove tags that setuptools_scm can't parse (only ai/* and release/* are valid)
          git tag -l | grep -v -E '^(ai|release)/' | xargs -r git tag -d

          docker run --rm \
            -v "${{ github.workspace }}:/${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e PUBLIC_IMAGE_REGISTRY_BASE="${{ env.DEV_REGISTRY_PATH }}/" \
            -e DEV_TAG_VERSION="${{ needs.setup.outputs.image_tag }}" \
            debian:trixie bash -c "
              set -e
              apt-get update
              apt-get install -y --no-install-recommends --no-install-suggests sudo git ca-certificates python3-dev python3-pip build-essential pkg-config
              echo '[global]' > /etc/pip.conf
              echo 'break-system-packages = true' >> /etc/pip.conf
              git config --global --add safe.directory '*'
              pip install go-task-bin==${{ env.TASKFILE_VERSION }}
              task init:ci
              task build-dev
            "

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY_HOST }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bake builds the selected containers and their parents in dependency
      # order through the parent links declared in docker-bake.hcl
      - name: Build and push Docker images
        uses: docker/bake-action@v7
        with:
          source: .
          targets: ${{ join(fromJson(needs.setup.outputs.containers)) }}
          files: ./docker-bake.hcl
          push: true
        env:
          REGISTRY: ${{ env.DEV_REGISTRY_PATH }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          RUN_NUMBER: ${{ github.run_number }}
          BASE_IMAGE_VERSION: ${{ needs.setup.outputs.image_tag }}
          CACHE_TAG: ${{ needs.setup.outputs.image_tag }}-buildcache
          SKIP_CACHE: ${{ inputs.skip_cache }}

      - name: SBOM Delta
        env:
          VERSION: ${{ needs.setup.outputs.image_tag }}
          REGISTRY: ${{ env.DEV_REGISTRY_PATH }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          python3 ./scripts/sbom_delta.py \
            --version "$VERSION" \
            --registry "$REGISTRY" \
            $(echo '${{ needs.setup.outputs.containers }}' | jq -r 'join(" ")')

      - name: Upload delta SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-delta
          path: ./containers/*/sbom-delta/
