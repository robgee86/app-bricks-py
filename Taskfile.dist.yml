version: "3"

vars:
  PYTHON_VERSION_MIN: "3.13"

tasks:
  init:
    desc: Initialize development environment
    deps:
      - check:python:version
    cmds:
      - task: install:deps

  init:ci:
    desc: Initialize CI environment
    deps:
      - check:python:version
    cmds:
      - apt-get update
      - apt-get install -y --no-install-recommends --no-install-suggests libasound2-dev portaudio19-dev libzbar0
      - apt-get install -y --no-install-recommends --no-install-suggests gh git ca-certificates build-essential pkg-config
      - apt-get install -y --no-install-recommends --no-install-suggests python3 python3-dev python3-pip python-is-python3
      - apt-get install -y --no-install-recommends --no-install-suggests libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - apt-get install -y --no-install-recommends --no-install-suggests libjpeg62-turbo-dev libpng-dev libtiff-dev libwebp-dev libopenblas-dev liblapacke-dev
      - apt-get install -y --no-install-recommends --no-install-suggests libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - task: install:deps

  check:python:version:
    desc: Check if Python version is at least {{.PYTHON_VERSION_MIN}}
    cmds:
      - |
        check_version() {
          python_alias=$1
          python_version=$($python_alias --version 2>&1 | awk '{print $2}')
          required_version="{{.PYTHON_VERSION_MIN}}"
          if [ "$(printf '%s\n' "$required_version" "$python_version" | sort -V | head -n1)" != "$required_version" ]; then
            echo "$python_alias version must be at least $required_version. Current version: $python_version"
            exit 1
          fi
        }

        check_version python

  install:deps:
    desc: Install project dependencies
    cmds:
      - uv sync

  doc:
    desc: Generate API documentation
    cmds:
      - uv run python -m docs_generator.runner docs

  provision-static:
    desc: Provision the static assets for the wheel build (bricks list + compose + api-docs + models-list)
    vars:
      STATIC_DIR: src/arduino/app_bricks/static
    cmds:
      - rm -rf {{.STATIC_DIR}}
      - uv run arduino-bricks-release --static-dir {{.STATIC_DIR}}

  test:
    desc: Run all unit tests
    cmds:
      - uv run pytest -vs ./tests --ignore=tests/arduino/app_bricks/cloud_llm/

  llm_test:
    desc: Run all LLM tests
    cmds:
      - uv run deepeval test run tests/arduino/app_bricks/cloud_llm/ -n 4 -vs

  test:*:
    desc: Run tests for a specific folder
    cmds:
      - uv run pytest -vs ./tests/{{index .MATCH 0}}

  lint:
    desc: Run linters
    cmds:
      - uv run ruff check --fix .

  fmt:
    desc: Format code
    cmds:
      - uv run ruff format

  build:
    desc: Build the wheel. Override the default 0.0.0 version by editing version.py.
    cmds:
      - defer: rm -rf src/arduino/app_bricks/static
      - rm -rf dist
      - task provision-static
      - uv build .

  license:headers:
    desc: Update SPDX license headers (REUSE)
    cmds:
      - |
        git ls-files |
        grep -Ev "(^|/)(docs|examples-internal|tools)/|\.(md|txt|json|yml|yaml|toml|gitignore|dockerignore|gitmodules|in|ini|eim|lock)$" |
        sed 's/ /\\ /g' |
        xargs uv run reuse annotate -r --skip-unrecognized --copyright-prefix 'spdx-string-c' --copyright 'ARDUINO SRL (http://www.arduino.cc)' --exclude-year --license 'MPL-2.0'
      - uv run reuse download --all
      - |
        licenses_dir="LICENSES"
        if [ -d "$licenses_dir" ]; then
          if [ -f "$licenses_dir/MPL-2.0.txt" ]; then
            mv "$licenses_dir/MPL-2.0.txt" LICENSE.txt
          fi
          rm -rf "$licenses_dir"
        fi
      # Strip trailing whitespace from license files.
      # The upstream SPDX license texts (fetched by `reuse download`)
      # contain stray trailing spaces that break license parsers such
      # as `licensed`.
      - cmd: find . -maxdepth 1 -name 'LICENSE*' -type f -exec sed -i '' 's/[[:space:]]*$//' {} +
        platforms: [darwin]
      - cmd: find . -maxdepth 1 -name 'LICENSE*' -type f -exec sed -i 's/[[:space:]]*$//' {} +
        platforms: [linux, windows]

  license:deps:
    desc: Check and cache dependency licenses (licensed, via Docker)
    cmds:
      - docker build -f containers/licensed/Dockerfile -t arduino-licensed .
      - docker run --rm -v "$(pwd):/src" arduino-licensed

  license:
    desc: Update license headers, files, and dependency license caches
    cmds:
      - task: license:headers
      - task: license:deps

  sbom:delta:
    desc: Generate delta SBOMs for containers (requires syft and registry access)
    cmds:
      - uv run python3 ./scripts/sbom_delta.py {{.CLI_ARGS}}
